<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <link rel="shortcut icon" href="assets/ationgram-icon.svg" type="image/x-icon">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Faça seu cadastro - ationgram</title>
</head>

<body>
    <div id="wrapper">
        <div id="container-signup">
            <div class="column">
                <div class="login-panel">
                    <div class="logo">
                        <img class="logo-img" src="assets/ationgram-logo.svg" alt="Logo do ationgran">
                    </div>
                    <div class="message">
                        <span>Cadastre-se para ver fotos e vídeos de seus amigos.</span>
                    </div>
                    <button class="cta-button">
                        Entrar com Facebook
                    </button>
                    <div class="divisor-container">
                        <div class="line"></div>
                        <div class="divisor-tag">ou</div>
                        <div class="line"></div>
                    </div>
                    <form action="">
                        <input type="text" placeholder="Número de celular ou email" name="email">
                        <input type="text" placeholder="Nome completo" name="name">
                        <input type="text" placeholder="Username" name="username">
                        <input type="password" placeholder="Senha" name="password">
                        <input type="submit" value="Cadastrar">
                    </form>
                </div>
                <div class="infobox">
                    <p>Tem uma conta? <a href="index.html">Conecte-se</a></p>
                </div>
                <div class="get-app-panel">
                    Obtenha o aplicativo.
                    <div class="app-buttons">
                        <a href="#"><img src="assets/ationgram-badge-appstore.svg" alt="Baixe na appstore"></a>
                        <a href="#"><img src="assets/ationgram-badge-googleplay.svg" alt="Baixe na Googleplay"></a>
                    </div>
                </div>
            </div>
        </div>
        <footer class="footer-inner">
            <a href="#">About Us</a>
            <a href="#">Support</a>
            <a href="#">Blog</a>
            <a href="#">Press</a>
            <a href="#">API</a>
            <a href="#">Jobs</a>
            <a href="#">Privacy</a>
            <a href="#">Terms</a>
            <a href="#">Directory</a>
            <a href="#">Profiles</a>
            <a href="#">Hashtag</a>
            <a href="#">Language</a>
            <div class="text-small">@ 2026 Ationgram</div>
        </footer>
    </div>
</body>

</html>
