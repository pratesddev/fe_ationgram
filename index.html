<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <link rel="shortcut icon" href="assets/ationgram-icon.svg" type="image/x-icon">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Ationgram - sua rede social</title>
</head>

<body>
    <div id="wrapper">
        <div id="container">
            <div class="column left">
                <div class="main"></div>
            </div>
            <div class="column right">
                <div class="login-panel">
                    <div class="logo">
                        <img class="logo-img" src="assets/ationgram-logo.svg" alt="Logo do ationgran">
                    </div>
                    <form action="">
                        <input type="text" placeholder="Telefone, usuário ou email" name="username">
                        <input type="password" placeholder="Senha" name="password">
                        <input type="submit" value="Entrar">
                    </form>
                </div>
                <div class="infobox">
                    <p>Não possui uma conta? <a href="signup.html">Cadastre-se</a></p>
                </div>
                <div class="get-app-panel">
                    Obtenha o aplicativo.
                    <div class="app-buttons">
                        <a href="#"><img src="assets/ationgram-badge-appstore.svg" alt="Baixe na appstore"></a>
                        <a href="#"><img src="assets/ationgram-badge-googleplay.svg" alt="Baixe na Googleplay"></a>
                    </div>
                </div>
            </div>
        </div>
        <footer class="footer-inner">
            <a href="#">About Us</a>
            <a href="#">Support</a>
            <a href="#">Blog</a>
            <a href="#">Press</a>
            <a href="#">API</a>
            <a href="#">Jobs</a>
            <a href="#">Privacy</a>
            <a href="#">Terms</a>
            <a href="#">Directory</a>
            <a href="#">Profiles</a>
            <a href="#">Hashtag</a>
            <a href="#">Language</a>
            <div class="text-small">@ 2026 Ationgram</div>
        </footer>
    </div>
</body>

</html>
